<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0d0b0e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>入</title>
<style>
:root{--bg:#0d0b0e;--ink:#e8e2dc;--dim:#8a8078;--line:#241f26;--red:#a8323c;--warm:#c9a227;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Songti SC","STSong","Noto Serif SC",serif;font-size:17px;line-height:1.8;
padding:calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 36px);
max-width:560px;margin:0 auto;-webkit-text-size-adjust:100%}
.s{display:none;animation:f .35s ease}.s.on{display:block}
@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1{font-size:25px;font-weight:400;letter-spacing:.4em;margin:0 0 4px}
p{margin:0 0 12px}
.w{color:var(--dim);font-size:13.5px;letter-spacing:.05em}
.c{text-align:center}
.big{font-size:21px;line-height:1.95;letter-spacing:.12em}
hr{border:none;height:1px;background:var(--line);margin:22px 0}
button{width:100%;padding:14px 16px;margin:7px 0;background:transparent;color:var(--ink);
border:1px solid var(--line);border-radius:2px;font-family:inherit;font-size:16px;
letter-spacing:.06em;text-align:left;transition:.15s}
button:active{background:#1b161d}
button.sel{border-color:var(--red);color:#fff;background:#1a1114}
button.go{border-color:var(--red);color:#fff;letter-spacing:.28em;text-align:center;padding:16px;margin-top:22px}
button.q{border:none;color:var(--dim);text-align:center;font-size:13.5px;letter-spacing:.2em;margin-top:12px}
input[type=text]{width:100%;background:transparent;border:none;border-bottom:1px solid var(--line);
color:var(--ink);font-family:inherit;font-size:18px;padding:10px 0;letter-spacing:.1em;text-align:center;margin-top:8px}
input[type=text]:focus{outline:none;border-color:var(--red)}
.paper{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.paper .n{color:var(--red);font-size:12px;letter-spacing:.25em;flex:0 0 auto}
.paper .t{flex:1}
.paper .m{color:var(--dim);font-size:12px;flex:0 0 auto}
.done{border-color:#2c3a2c}
.bar{height:1px;background:var(--line);margin:16px 0}
.seal{border:1px solid var(--red);padding:20px;margin:16px 0;text-align:center;letter-spacing:.4em;color:var(--red);font-size:14px}
.chk{display:flex;gap:10px;align-items:flex-start;margin:12px 0;font-size:15px;line-height:1.7}
.box{flex:0 0 auto;width:20px;height:20px;border:1px solid var(--line);margin-top:3px;border-radius:1px}
.chk.on .box{border-color:var(--red);background:var(--red)}
h2{font-size:16px;font-weight:400;letter-spacing:.2em;margin:26px 0 8px;color:var(--ink)}
h2 span{color:var(--dim);font-size:12px;letter-spacing:.1em;margin-left:8px}
</style>
</head>
<body>

<!-- 首页 -->
<section id="s-home" class="s on">
  <div style="height:8vh"></div>
  <h1 class="c">入</h1>
  <p class="c w" id="home-no">还没有编号</p>
  <hr>
  <div id="combo"></div>
  <div class="bar"></div>
  <p class="w">十五卷</p>
  <div id="papers"></div>
  <div class="bar"></div>
  <button onclick="openContract()">契 约</button>
  <button onclick="exportJSON()">导出这一份</button>
  <button class="q" onclick="wipe()">全部清掉</button>
</section>

<!-- 答题 -->
<section id="s-quiz" class="s">
  <div class="paper" style="margin-bottom:14px">
    <span class="n" id="q-no">卷一</span>
    <span class="m" id="q-prog">1 / 18</span>
  </div>
  <p class="big" id="q-text" style="margin:18px 0 24px"></p>
  <div id="q-opts"></div>
  <button class="q" id="q-next" style="display:none" onclick="nextQ()">下 一 题</button>
  <button class="q" onclick="backHome()">回去</button>
</section>

<!-- 契约 -->
<section id="s-contract" class="s">
  <p class="w">契约</p>
  <p class="big" style="margin-top:14px">看完，再签。</p>
  <p class="w">只勾你要的。勾了才生效，没勾等于没写。</p>
  <div id="contract"></div>
  <hr>
  <p class="w c">写下你的代号</p>
  <input type="text" id="sig" placeholder="代号" autocomplete="off">
  <button class="go" onclick="signIt()">签</button>
  <button class="q" onclick="backHome()">回去</button>
</section>

<!-- 完成 -->
<section id="s-done" class="s">
  <div style="height:12vh"></div>
  <p class="c w">编号</p>
  <p class="c big" id="d-no" style="letter-spacing:.5em;color:var(--warm);font-size:26px"></p>
  <div class="seal">已 入</div>
  <p class="c w" id="d-sig"></p>
  <div style="height:8vh"></div>
  <p class="c w" id="d-words">「记住今晚。」</p>
  <hr>
  <button onclick="exportJSON()">导出这一份（发给电脑）</button>
  <button class="q" onclick="backHome()">回去</button>
</section>

const Q = {}; D.q.forEach(x => Q[x.id] = x);
const A = JSON.parse(localStorage.getItem("ans") || "{}");
const C = JSON.parse(localStorage.getItem("con") || "[]");
let NO = localStorage.getItem("no");
let cur = null, idx = 0, tick = {};

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const save = () => { localStorage.setItem("ans", JSON.stringify(A)); localStorage.setItem("con", JSON.stringify(C)); };

function show(id){
  document.querySelectorAll(".s").forEach(x => x.classList.remove("on"));
  $(id).classList.add("on");
  window.scrollTo(0,0);
}
function backHome(){ renderHome(); show("s-home"); }

/* ───── 首页 ───── */
function renderHome(){
  $("home-no").textContent = NO ? ("编号 " + NO) : "还没有编号";
  $("combo").innerHTML = D.papers.combo.map((c,i) =>
    `<button onclick="openCombo(${i})"><div class="paper"><span class="t">${esc(c.name)}</span><span class="m">${c.count} 题 · ${c.minutes} 分</span></div></button>`
  ).join("");
  $("papers").innerHTML = D.papers.juan.map((j,i) => {
    const n = j.ids.filter(id => A[id] !== undefined).length;
    const cls = n >= j.count ? "done" : "";
    return `<button class="${cls}" onclick="openPaper(${i})"><div class="paper">
      <span class="n">${esc(j.no)}</span>
      <span class="t">${esc(j.name)}</span>
      <span class="m">${n}/${j.count}</span></div></button>`;
  }).join("");
}

/* ───── 答题 ───── */
function openPaper(i){
  const j = D.papers.juan[i];
  cur = {no: j.no, name: j.name, ids: j.ids.slice()};
  idx = 0; renderQ();
}
function openCombo(i){
  const c = D.papers.combo[i];
  cur = {no: c.name, name: "", ids: c.ids.slice()};
  idx = 0; renderQ();
}
function renderQ(){
  if(idx >= cur.ids.length){ cur = null; backHome(); return; }
  const q = Q[cur.ids[idx]];
  $("q-no").textContent = cur.no;
  $("q-prog").textContent = (idx+1) + " / " + cur.ids.length;
  $("q-text").textContent = q.q;
  const chosen = A[q.id];
  const multi = q.kind === "multi";
  $("q-opts").innerHTML = q.opts.map((o,k) => {
    const on = multi ? Array.isArray(chosen) && chosen.includes(o) : chosen === o;
    return `<button class="${on ? "sel" : ""}" onclick="pickOpt(${k})">${esc(o)}</button>`;
  }).join("");
  $("q-next").style.display = multi ? "block" : "none";
}
function pickOpt(k){
  const q = Q[cur.ids[idx]];
  const o = q.opts[k];
  if(q.kind === "multi"){
    let arr = Array.isArray(A[q.id]) ? A[q.id].slice() : [];
    arr = arr.includes(o) ? arr.filter(x => x !== o) : arr.concat([o]);
    A[q.id] = arr;
    save(); renderQ();
  } else {
    A[q.id] = o; save();
    const btn = $("q-opts").children[k];
    if(btn) btn.classList.add("sel");
    nextQ();
  }
}
function nextQ(){ idx++; renderQ(); }

/* ───── 契约 ───── */
let flat = [];
function openContract(){
  flat = [];
  let h = "";
  D.contract.forEach(([title, sub, items]) => {
    h += `<h2>${esc(title)}${sub ? "<span>" + esc(sub) + "</span>" : ""}</h2>`;
    items.forEach(t => {
      const i = flat.length; flat.push(t);
      const on = C.includes(i);
      h += `<div class="chk ${on?"on":""}" data-i="${i}" onclick="toggleC(${i})"><div class="box"></div><div>${esc(t)}</div></div>`;
    });
  });
  $("contract").innerHTML = h;
  const sig = JSON.parse(localStorage.getItem("sig") || "null");
  if(sig) $("sig").value = sig.name || "";
  show("s-contract");
}
function toggleC(i){
  const p = C.indexOf(i);
  if(p >= 0) C.splice(p,1); else C.push(i);
  save();
  const el = document.querySelector('.chk[data-i="' + i + '"]');
  if(el) el.classList.toggle("on", C.includes(i));
}
function signIt(){
  const nm = $("sig").value.trim();
  if(!nm){ $("sig").focus(); return; }
  if(!NO){ NO = String(Math.floor(Math.random()*900)+100); localStorage.setItem("no", NO); }
  const at = new Date().toLocaleString("zh-CN", {hour12:false});
  localStorage.setItem("sig", JSON.stringify({name:nm, at:at, no:NO, n:C.length}));
  $("d-no").textContent = NO;
  $("d-sig").textContent = nm + "　·　" + at + "　·　勾了 " + C.length + " 条";
  show("s-done");
}

/* ───── 导出 ───── */
function exportJSON(){
  const payload = {
    no: NO,
    sig: JSON.parse(localStorage.getItem("sig") || "null"),
    answered: Object.keys(A).length,
    answers: Object.fromEntries(Object.entries(A).map(([k,v]) => [k, {q: Q[k] ? Q[k].q : "", a: v}])),
    contract: C.map(i => flat[i]).filter(Boolean),
    at: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "intake-" + (NO || "000") + ".json";
  a.click();
}
function wipe(){
  if(!confirm("全部清掉？记录会没。")) return;
  localStorage.clear(); location.reload();
}

renderHome();
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
</script>
